name: Release

on:
  push:
    tags: ["v*.*.*"]
  repository_dispatch:
    types: [new-tag-created]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Get changelog for this version
        id: changelog
        run: |
          # Extract the curated section for the current version from
          # CHANGELOG.md (same task as `just changelog` locally — manual
          # edits are the source of truth; the section header goes to
          # stderr, only the body is captured).
          BODY=$(just changelog)
          echo "Changelog body:"
          echo "$BODY"
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.body }}
